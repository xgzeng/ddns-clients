# ddnsd configuration; all settings are described in
# /usr/share/ddnsd/ddnsd.example.toml. Uncomment and fill in a provider,
# then run: /etc/init.d/ddnsd restart
#
# The file holds credentials: ddnsd refuses it if group or others can read it.

# By default, the global addresses of local interfaces that an echo service
# sees as themselves are published.
# [resolver]
# local = false                # behind NAT: publish what the echo service sees
# interface = "pppoe-wan"      # only this device's addresses, e.g. the WAN

# [provider.cloudflare]
# api_token = "..."            # needs Zone:Read and DNS:Edit
# zone = "example.com"
# domain = "home"              # home.example.com

# [provider.noip]
# username = "..."
# password = "..."
# domain = "myhost.ddns.net"

# [provider.pkarr]
# secret_key = "..."           # 64 hex digits: openssl rand -hex 32
# domain = "home"              # home.<public key>
