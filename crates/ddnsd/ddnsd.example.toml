# Example ddnsd configuration. Install it with restricted permissions, the
# daemon refuses a config readable by group or others:
#
#   install -m 600 ddnsd.example.toml /etc/ddnsd.toml
#
# Top-level settings must come before the [resolver] and [provider.<name>] tables.

tick = 15                      # seconds between checks, which retry failed
                               # updates; default 15
resolve_interval = 300         # seconds between public ip lookups, default 300;
                               # on Linux also at the next check after the local
                               # addresses change
# defaults for all providers, each can override them
ipv4 = true                    # look up IPv4 addresses, and the default for
                               # providers, which can't enable it if false;
                               # default true
ipv6 = true                    # the same for IPv6; default true
ttl = 600                      # 0 = provider default; default 600
max_records = 2                # max A/AAAA records kept, default 2
replace_only = false           # only re-point existing records, never create or
                               # delete any; default false
cache_expire = 3600            # seconds after which records are read again from the
                               # provider, warning about changes made elsewhere;
                               # 0 = never; default 3600

# How the public addresses are found: each global address of local interfaces
# that an echo service, asked from that address, sees as itself (Linux), or
# else the address the echo service sees. The echo services are fallbacks:
# icanhazip.com, ifconfig.me and ipify.org, then the URLs below.
[resolver]
# local = true                 # check local addresses; false behind NAT (Linux)
# interface = "eth0"           # only this interface's addresses, and only its
                               # changes trigger a lookup; default all
# builtin_urls = true          # use the built-in echo services; default true
# url = "https://ip.example.net"  # more echo services, for both families
# ipv4_url = ["https://ipv4.example.net"]  # for IPv4, before url; each a URL
# ipv6_url = ["https://ipv6.example.net"]  # or a list of them

# One table per provider. `type` defaults to the name after "provider.", so
# [provider.cloudflare] needs no type; several entries of the same type need
# distinct names and an explicit type.
[provider.cloudflare]
api_token = "..."              # needs Zone:Read and DNS:Edit
zone = "example.com"
domain = "myhost.example.com"  # optional for cloudflare, default <hostname>; the zone
                               # is appended unless it already ends with it; "" is the zone itself

# [provider.noip]
# username = "..."
# password = "..."
# user_agent = "..."           # optional; "Company Program/Version contact@example.com"
# domain = "myhost.ddns.net"   # required
# ipv6 = false                 # overrides the default above

# [provider.pkarr]
# secret_key = "..."           # 64 hex digits: openssl rand -hex 32
# secret_file = "pkarr.key"    # or a file holding it, mode 600; relative to this
#                              # file's directory. One of the two is required
# domain = "home"              # optional, the name below the key: home.<public key>;
#                              # default the key itself
# relays = []                  # optional; relay URLs besides the DHT, [] = DHT only;
#                              # default pkarr's relays
# keep_other_records = true    # optional; keep the key's other records, default true
# cache_expire = 3600          # the records are published again this often; not 0
