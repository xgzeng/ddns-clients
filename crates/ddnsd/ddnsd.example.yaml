# Example ddnsd configuration. Install it with restricted permissions, the
# daemon refuses a config readable by group or others:
#
#   install -m 600 ddnsd.example.yaml /etc/ddnsd.yaml

provider:
  type: cloudflare
  api_token: "..."             # needs Zone:Read and DNS:Edit
  zone: example.com
# provider:
#   type: noip
#   username: "..."
#   password: "..."
#   user_agent: "..."          # optional; "Company Program/Version contact@example.com"

domain: myhost.example.com     # optional for cloudflare, default <hostname>.<zone>; required for noip
ipv4: true                     # default true
ipv6: true                     # default true
interval: 300                  # seconds between checks, default 300
ttl: 600                       # 0 = provider default; default 600
max_records: 2                 # max A/AAAA records kept, default 2
resolvers:                     # tried in order per family; default: icanhazip, local
  - type: icanhazip
  - type: local                # global addresses of local interfaces
