[package]
name = "ddns-clients"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A multi-provider dynamic DNS client library written in Rust."

[features]
default = ["cloudflare", "noip"]
cloudflare = ["dep:serde", "dep:serde_json", "reqwest/json", "reqwest/query"]
noip = ["reqwest/query", "tokio/net"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
log.workspace = true
reqwest = "0.13"
serde = { version = "1.0.219", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = "0.33"
rtnetlink = "0.23.0"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
