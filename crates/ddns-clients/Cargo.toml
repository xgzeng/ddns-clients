[package]
name = "ddns-clients"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A multi-provider dynamic DNS client library written in Rust."

[features]
default = ["pkarr"]
# the PKARR provider, publishing over the Mainline DHT and PKARR relays
pkarr = ["dep:pkarr"]

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
futures-util = "0.3"
log.workspace = true
pkarr = { version = "8.1", optional = true }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route = "0.33"
rtnetlink = "0.23.0"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
