# Builds the release artifacts: static ddnsd binaries and Debian packages.
# Called by the CI and Release workflows; uploads one artifact per build.
name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  binary:
    name: Binary (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # static, so the binary runs on any Linux distribution
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p ddnsd --target ${{ matrix.target }}
      - name: Collect
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          mkdir dist
          cp target/${{ matrix.target }}/release/ddnsd "dist/ddnsd-$version-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  deb:
    name: Debian package (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get build-dep -y ./
      - name: Build
        run: dpkg-buildpackage -b -us -uc
      - name: Collect
        run: |
          mkdir dist
          mv ../ddnsd_*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
