# Publishes a GitHub release for a pushed `v<version>` tag, with the static
# ddnsd binaries and Debian packages.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml and debian/changelog
        run: |
          tag=${GITHUB_REF_NAME#v}
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          debian=$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)
          echo "tag=$tag cargo=$cargo debian=$debian"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$debian" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml ($cargo) and debian/changelog ($debian)"
            exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
